name: Update playlists and deploy

on:
  schedule:
    - cron: "17 5 * * *"      # daily, 05:17 UTC
  workflow_dispatch:
    inputs:
      full:
        description: "Rescan every playlist (slow, ~25 min)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/**"
      - ".github/workflows/update.yml"

permissions:
  contents: write     # commit the refreshed snapshot
  pages: write
  id-token: write

concurrency:
  group: playlists
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.scrape.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yt-dlp
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade yt-dlp

      # only meaningful on a scheduled/manual run; a push just rebuilds the site
      - name: Refresh playlist data
        id: scrape
        if: github.event_name != 'push'
        run: |
          python scripts/update_playlists.py "${{ vars.CHANNEL || '@sipslive' }}" \
            ${{ inputs.full && '--full' || '' }}

      - name: Build site data
        run: python scripts/build_site_data.py

      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ site/data.json
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "data: refresh $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
